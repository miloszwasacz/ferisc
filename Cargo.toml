[workspace]
members = ["crates/macros"]

[workspace.dependencies]
ferisc-macros = { path = "crates/macros" }
paste = "1.0.15"
proc-macro2 = "1.0.106"
syn = "2.0.118"
quote = "1.0.46"
convert_case = "0.11.0"

[package]
name = "ferisc"
version = "0.1.0"
edition = "2024"
build = "build/main.rs"

[features]
default = ["tui"]
tui = ["crossterm", "ratatui", "elf"]

[dependencies]
ferisc-macros = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["constructor", "debug", "deref", "deref_mut"] }
generic-array = "1.4.3"
num_enum = "0.7.6"
bitflags = "2.13.0"
paste = { workspace = true }
const_format = "0.2.36"
static_assertions = "1.1.0"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.2", optional = true }
elf = { version = "0.8.0", optional = true }

[build-dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
convert_case = { workspace = true }
prettyplease = "0.2.37"
walkdir = "2.5.0"
